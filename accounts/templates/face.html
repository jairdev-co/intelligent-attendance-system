{% extends 'layout.html' %}
{% load static %}
{# Attendance screen (home page) #}

{% block styles %}
<link rel="stylesheet" href="{% static 'css/face.css' %}">
{% endblock %}

{% block content %}

<div class="face-container">
    <img src="{% static 'img/logo-cesmag.png' %}" alt="Universidad CESMAG" class="title-logo">
    <a href="{% url 'login' %}" class="title-link"><h2>Sistema de Asistencia Inteligente</h2></a>
    <div id="message" class="alert"></div>
    <div id="camera-container">
        <video id="video" width="100%" height="auto" autoplay playsinline muted></video>
        <canvas id="canvas" width="640" height="480"></canvas>
    </div>

    <input type="hidden" id="csrf-token" value="{{ csrf_token }}">
    <input type="hidden" id="face-url" value="{% url 'face' %}">
    <div id="user-info">
        <p>Seleccione su tipo de asistencia:</p>
        <div class="buttons-container">
            <button id="entry-button" data-type="entry">Entrada</button>
            <button id="exit-button" data-type="exit">Salida</button>
        </div>
    </div>
</div>

<script src="{% static 'js/camera.js' %}"></script>
<script src="{% static 'js/face.js' %}"></script>

{% endblock %}
